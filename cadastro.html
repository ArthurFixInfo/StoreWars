<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Store Wars</h1>
        <h2>Sua loja n°1 das estrelas</h2>
    </header>
    <div id="container">
    <h3>Cadastro de produtos</h3>
    <form id="form">
        <div id="containerinfos">
            <div>
            <label for="nome">Produto:&nbsp;&nbsp;&nbsp;</label>
            <input type="text" id="nome" placeholder="Nome do Produto">
            </div>

            <div>
            <label for="descricao">Descrição:</label>
            <input type="text" id="descricao" placeholder="Descrição do Produto">
            </div>

            <div>
            <label for="preco">Preço:&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</label>
            <input type="number" step="0.01" id="preco" placeholder="R$">
            </div>


            <div>
            <input type="submit" value="Cadastrar Produto">
            <input type="reset" value="Cancelar">
            </div>

        </div>

        <div id="containerimagem">
            <img id="imgproduto">
            <label for="imagem">Imagem do Produto:</label>
            <input type="file" id="imagem" accept="image/png, image/jpeg, image/gif, image/webp, image/svg+xml, image/avif">
        </div>

    </form>
    </div>

    <script src="cadastro.js"></script>
</body>
</html>
